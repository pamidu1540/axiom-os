name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Verify source
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          ./tests/lint-axiom.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/test-axiom.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'inno.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') { throw 'Compiler signature check failed.' }
          $directory = Join-Path $env:RUNNER_TEMP 'inno'
          $process = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',('/DIR="'+$directory+'"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed.' }
      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $version = '7.6.7'
          $archive = Join-Path $env:RUNNER_TEMP "PowerShell-$version-win-x64.zip"
          $base = "https://github.com/PowerShell/PowerShell/releases/download/v$version"
          Invoke-WebRequest "$base/PowerShell-$version-win-x64.zip" -OutFile $archive
          $checksums = (Invoke-WebRequest "$base/hashes.sha256").Content
          $line = ($checksums -split "`n") | Where-Object { $_.Trim() -match ('PowerShell-' + [regex]::Escape($version) + '-win-x64.zip$') }
          if ($line.Trim() -notmatch '^([A-Fa-f0-9]{64})\s+\*?PowerShell-') { throw 'Official runtime checksum not found.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $Matches[1]) { throw 'Runtime checksum verification failed.' }
          $runtime = Join-Path $env:RUNNER_TEMP 'powershell-runtime'
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          ./packaging/build.ps1 -Iscc "$env:RUNNER_TEMP/inno/ISCC.exe" -PowerShellHome $runtime
      - name: Verify packaged app
        shell: pwsh
        run: ./packaging/smoke-package.ps1
      - name: Verify install and uninstall
        shell: pwsh
        run: ./packaging/smoke-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Axiom-OS-Windows
          path: |
            dist/*-Setup.exe
            dist/*-Windows-Portable.zip
            dist/SHA256SUMS.txt
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*-Setup.exe
            dist/*-Windows-Portable.zip
            dist/SHA256SUMS.txt
